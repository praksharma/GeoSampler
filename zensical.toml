[project]
site_name = "GeoSampler"
site_description = "Geometry-aware sampling for PINNs and scientific machine learning"
copyright = "GeoSampler · AGPL-3.0-only"
docs_dir = "docs"
site_dir = "site"
nav = [
  { "Overview" = "index.md" },
  { "Get started" = "guide/getting-started.md" },
  { "User guide" = [
    { "Workspace and visibility" = "guide/workspace.md" },
    { "Geometry and selection" = "guide/geometry.md" },
    { "Boundary regions" = "guide/regions.md" },
    { "Sampling and accuracy" = "guide/sampling.md" },
    { "Outward normals" = "guide/normals.md" },
    { "Datasets and editing" = "guide/datasets.md" },
    { "Projects and recovery" = "guide/projects.md" },
    { "Translation previews" = "guide/parametrisation.md" },
    { "Graphics troubleshooting" = "guide/graphics.md" },
  ] },
  { "Data reference" = [
    { "NetCDF, NPZ and xarray" = "reference/exports.md" },
    { "Attribution and licences" = "reference/attribution.md" },
  ] },
  { "Development" = [
    { "Architecture and scope" = "development/architecture.md" },
    { "Testing" = "development/testing.md" },
    { "Performance" = "development/performance.md" },
    { "Release checks and example" = "development/release.md" },
    { "Maintaining the docs" = "development/documentation.md" },
    { "Roadmap" = "development/roadmap.md" },
  ] },
]

[project.theme]
language = "en"
font = false
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.path",
  "navigation.top",
  "navigation.footer",
  "search.highlight",
  "content.code.copy",
]

[project.theme.icon]
logo = "lucide/shapes"

[[project.theme.palette]]
scheme = "default"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions."pymdownx.highlight"]
anchor_linenums = true
[project.markdown_extensions."pymdownx.superfences"]
[project.markdown_extensions."pymdownx.tasklist"]
custom_checkbox = true
