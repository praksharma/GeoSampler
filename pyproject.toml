[project]
name = "jorvik"
version = "0.1.0.dev0"
description = "Geometry-aware point sampling for PINNs and scientific machine learning"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = ["PySide6==6.12.0", "gmsh==4.15.2", "numpy>=2.2,<3", "scipy>=1.15,<2", "xarray>=2025.1,<2027"]

[project.scripts]
jorvik = "jorvik:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jorvik"]

[dependency-groups]
docs = [
    "zensical>=0.0.71",
]
