name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'GUIDE.md'
      - 'TODO.md'
      - 'THIRD_PARTY.md'
      - 'LICENSE'
      - 'scripts/sync_docs.py'
      - 'zensical.toml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'GUIDE.md'
      - 'TODO.md'
      - 'THIRD_PARTY.md'
      - 'LICENSE'
      - 'scripts/sync_docs.py'
      - 'zensical.toml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.12'
      - name: Install documentation tools only
        run: uv sync --locked --only-group docs
      - name: Check canonical guide and roadmap pages
        run: uv run --locked --only-group docs python scripts/sync_docs.py --check
      - name: Build and validate links
        run: uv run --locked --only-group docs zensical build --clean --strict
      - name: Upload built documentation
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Deploy built documentation
        id: deployment
        uses: actions/deploy-pages@v5
